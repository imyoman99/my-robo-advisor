# CIO 중심 모듈형 퀀트 백테스트 설정

universe_key: cio_universe

periods:
  start: "2015-01-01"
  end: "2024-12-31"

data:
  source: csv
  prices_path: data/processed/prices.csv

scoring:
  # 현금/단기채(Static Asset) 심볼
  cash_asset: CASH
  # 팩터 구성 (가중치 합은 자유)
  factors:
    - name: momentum
      weight: 1.0
      params:
        window: 126
    - name: volatility
      weight: -0.5
      params:
        window: 60
    - name: value
      weight: 0.2
      params: {}

rebalancing:
  trigger:
    # time | threshold
    type: time
    freq: M
    threshold: 0.05
  method:
    # absolute_score | rank | risk_parity
    type: absolute_score
    top_n: 5
    window: 60
