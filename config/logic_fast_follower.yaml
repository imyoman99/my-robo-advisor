#   threshold: 0.4
#   window: 60
# momentum_ranker:
#   type: simple   # simple | vol_adj
#   window: 60
#   # vol_adj 옵션일 때만 사용
#   # vol_window: 60
#   # min_vol: 1.0e-8
# selector:
#   type: rank_range   # rank_range | topn
#   rank_range: [4, 7]
#   replacement_order: [1, 2, 3, 8, 9, 10]
# allocator:
#   type: slot_weights # slot_weights | equal | inv_vol
#   slot_weights: [0.3, 0.3, 0.2, 0.2]
#   # inv_vol 옵션일 때만 사용
#   # window: 60
